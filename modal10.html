<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>360° Ko'rinish | Schindler</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.css" />
  <link rel="stylesheet" href="styles/main.css" />
  <style>
    body {
      overflow: hidden;
    }
    
    .panorama-container {
      width: 100%;
      height: 100vh;
      position: relative;
    }
    
    .controls {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 10px;
      z-index: 10;
    }
    
    .logo-overlay {
      position: absolute;
      top: 20px;
      left: 20px;
      z-index: 10;
      background-color: rgba(255, 255, 255, 0.9);
      padding: 10px 15px;
      border-radius: 5px;
      box-shadow: var(--shadow-md);
    }
    
    .model-info {
      position: absolute;
      top: 20px;
      right: 20px;
      z-index: 10;
      background-color: rgba(255, 255, 255, 0.9);
      padding: 15px;
      border-radius: 5px;
      box-shadow: var(--shadow-md);
      max-width: 300px;
    }
    
    .model-info h2 {
      margin-bottom: 5px;
      font-size: 1.2rem;
    }
    
    .model-info p {
      margin-bottom: 0;
      font-size: 0.9rem;
      color: var(--gray-color);
    }
    
    .back-button {
      position: absolute;
      bottom: 20px;
      left: 20px;
      z-index: 10;
    }
  </style>
</head>
<body>
  <div class="panorama-container" id="panorama"></div>
  
  <div class="logo-overlay">
    <div class="logo">
      <img src="img/schindler.png" alt="Schindler Logo" class="logo-img" />
    </div>
  </div>
  
  <div class="model-info" id="model-info">
    <h2 id="model-title">Lift modeli</h2>
    <p id="model-description">Lift tavsifi</p>
  </div>
  
  <div class="controls">
    <button class="btn btn-control" id="rotate-left">
      <i class="fas fa-arrow-left"></i>
    </button>
    <button class="btn btn-control" id="zoom-in">
      <i class="fas fa-search-plus"></i>
    </button>
    <button class="btn btn-control" id="zoom-out">
      <i class="fas fa-search-minus"></i>
    </button>
    <button class="btn btn-control" id="rotate-right">
      <i class="fas fa-arrow-right"></i>
    </button>
  </div>
  
  <a href="catalog.html" class="btn btn-primary back-button">
    <i class="fas fa-arrow-left"></i> Katalogga qaytish
  </a>z

  <script src="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.js"></script>
  <script>
    // Elevator model data
    const elevatorModels = {
  model1: {
    title: 'K-02 Premium',
    description: 'Qora marmar panelli premium lift kabinasi',
    panoramaUrl: 'img/Schindler 3000 AP (0023) - Cinnamon Wood.jpg'
  },
};

document.addEventListener('DOMContentLoaded', () => {
  const modal = document.getElementById('modal-360');
  const modalTitle = modal.querySelector('.modal-title');
  const panoramaContainer = document.getElementById('panorama');
  let viewer;

  document.querySelectorAll('.view-details-btn').forEach(button => {
    button.addEventListener('click', () => {
      const modelId = button.getAttribute('data-model');
      const model = elevatorModels[modelId];

      if (!model) {
        alert('Model topilmadi');
        return;
      }

      modalTitle.textContent = model.title;

      // Agar avval ochilgan bo'lsa, reload qilamiz
      if (viewer) {
        viewer.loadScene('default', {
          type: 'equirectangular',
          panorama: model.panoramaUrl
        });
      } else {
        viewer = pannellum.viewer('panorama', {
          type: 'equirectangular',
          panorama: model.panoramaUrl,
          autoLoad: true
        });
      }

      modal.style.display = 'block';
    });
  });

  // Modalni yopish
  document.querySelector('.close-modal').addEventListener('click', () => {
    modal.style.display = 'none';
  });
});


    document.addEventListener('DOMContentLoaded', function() {
      // Get model ID from URL parameters
      const urlParams = new URLSearchParams(window.location.search);
      const modelId = urlParams.get('model') || 'model1';
      
      // Get model data
      const model = elevatorModels[modelId] || elevatorModels.model1;
      
      // Set model info
      document.getElementById('model-title').textContent = model.title;
      document.getElementById('model-description').textContent = model.description;
      
      // Initialize panorama viewer
      const viewer = pannellum.viewer('panorama', {
        type: 'equirectangular',
        panorama: model.panoramaUrl,
        autoLoad: true,
        autoRotate: -2,
        compass: false,
        hfov: 100,
        showControls: false,
        showZoomCtrl: false,
        showFullscreenCtrl: false
      });
      // Control buttons
      document.getElementById('rotate-left').addEventListener('click', function() {
        const yaw = viewer.getYaw();
        viewer.setYaw(yaw - 30);
      });
      
      document.getElementById('rotate-right').addEventListener('click', function() {
        const yaw = viewer.getYaw();
        viewer.setYaw(yaw + 30);
      });
      
      document.getElementById('zoom-in').addEventListener('click', function() {
        const hfov = viewer.getHfov();
        viewer.setHfov(hfov - 10);
      });
      
      document.getElementById('zoom-out').addEventListener('click', function() {
        const hfov = viewer.getHfov();
        viewer.setHfov(hfov + 10);
      });
    });
  </script>
</body>
</html>
